name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "This tag is not on main. Tag a commit that has landed on main." >&2
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(node scripts/release-version.mjs "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Refuse a version that is already on npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if published="$(npm view "usecanon@$version" version 2>npm-view.err)"; then
            if [ "$published" = "$version" ]; then
              echo "usecanon $version is already on npm. Bump the version for a new release." >&2
              exit 1
            fi
            if [ -n "$published" ]; then
              echo "npm returned an unexpected answer: $published" >&2
              exit 1
            fi
          elif ! grep -q "E404" npm-view.err; then
            echo "Could not ask npm whether usecanon $version exists. Re-run the job." >&2
            cat npm-view.err >&2
            exit 1
          fi
          rm -f npm-view.err

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          node scripts/release-notes.mjs "$version" > notes.md

      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
