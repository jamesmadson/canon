<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Canon</title>
    <style>
      /* The app palette, monochrome on both sides. Every token is defined here
         on :root and only redefined for dark, so nothing has a value that
         exists in one colour scheme and not the other. The warm bias in the
         neutrals is the palette's one opinion. No hue in the chrome. */
      :root {
        --ground: #eeede9;
        --panel: #fafaf8;
        --recess: #e4e2dc;
        --rule: #d8d6d0;
        --ink-soft: #6e6b64;
        --ink: #1a1815;

        /* 9 / 11 / 14. Concentric: inner equals outer minus the padding. */
        --radius-sm: 9px;
        --radius-md: 11px;
        --radius-lg: 14px;

        /* Public Sans and IBM Plex Mono where the machine already has them,
           and the system stack where it does not. Named, never fetched: no
           font link and no embedded face declaration anywhere in this file,
           which is what keeps it honest about making no requests. */
        --sans: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

        color-scheme: light;
      }

      /* Three states, two blocks, and neither folds into the other: an
         explicit Light has to win over a dark operating system, and the
         default has to follow the operating system without being told. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-app-theme="light"]) {
          --ground: #191817;
          --panel: #232120;
          --recess: #2e2b29;
          --rule: #35322f;
          --ink-soft: #9a968d;
          --ink: #edebe6;
          color-scheme: dark;
        }
      }

      :root[data-app-theme="dark"] {
        --ground: #191817;
        --panel: #232120;
        --recess: #2e2b29;
        --rule: #35322f;
        --ink-soft: #9a968d;
        --ink: #edebe6;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--ground);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        font-weight: 400;
        line-height: 1.6;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px 12px 40px;
      }

      @media (min-width: 720px) {
        .page {
          padding: 24px 20px 56px;
        }
      }

      /* Silkscreened labels. Mono, small, wide, never a sentence. */
      .label {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        margin: 0;
      }

      /* Weight 200 only up here. At 28px and above the thin axis has enough
         stem to hold, and below it the body weight takes over. */
      .display {
        font-size: 30px;
        font-weight: 200;
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 0;
      }

      @media (min-width: 640px) {
        .display {
          font-size: 34px;
        }
      }

      .note {
        margin: 4px 0 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }

      /* The shell is a fill on the page, not a box with a line around it. */
      .shell {
        background: var(--ground);
        color: var(--ink);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }

      /* ---- Top bar ---------------------------------------------------- */

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        padding: 6px 12px;
        background: var(--panel);
      }

      .wordmark {
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 0 8px;
        margin-left: -8px;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: var(--ink-soft);
        cursor: pointer;
      }

      .wordmark:hover {
        color: var(--ink);
      }

      .crumb {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        margin: 0;
        font-size: 13px;
        color: var(--ink-soft);
      }

      .crumb .sep {
        color: var(--rule);
      }

      .crumb .owner {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .crumb .repo {
        font-size: 16px;
        font-weight: 500;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .account {
        position: relative;
        margin-left: auto;
      }

      .account-button {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 8px;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        font: inherit;
        font-size: 13px;
        color: var(--ink-soft);
        cursor: pointer;
      }

      .account-button:hover {
        color: var(--ink);
      }

      .avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--recess);
        color: var(--ink);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      /* The menu floats over both the ground and the panels beneath it, and
         there are no shadows to lift it, so it takes the recess: the one fill
         that reads as distinct against either. */
      .account-menu {
        position: absolute;
        right: 0;
        top: 100%;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 264px;
        max-width: calc(100vw - 24px);
        margin-top: 4px;
        padding: 4px;
        border-radius: var(--radius-md);
        background: var(--recess);
      }

      .account-menu[hidden] {
        display: none;
      }

      .account-menu .block {
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--panel);
      }

      .account-menu .who {
        margin: 4px 0 0;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      .theme-row {
        display: flex;
        gap: 2px;
        margin-top: 8px;
      }

      .theme-option {
        flex: 1;
        min-height: 44px;
        padding: 0 8px;
        border: 0;
        border-radius: 5px;
        background: none;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-soft);
        cursor: pointer;
      }

      .theme-option[aria-pressed="true"] {
        background: var(--recess);
        color: var(--ink);
      }

      /* ---- Sidebar and well -------------------------------------------- */

      .frame {
        display: flex;
        flex-direction: column;
      }

      @media (min-width: 760px) {
        .frame {
          flex-direction: row;
        }
      }

      .sidebar {
        flex-shrink: 0;
        padding: 8px;
      }

      @media (min-width: 760px) {
        .sidebar {
          width: 192px;
        }
      }

      .sidebar ul {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      @media (min-width: 760px) {
        .sidebar ul {
          flex-direction: column;
          flex-wrap: nowrap;
        }
      }

      .nav-item {
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 0 12px;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-soft);
        text-align: left;
        cursor: pointer;
      }

      @media (min-width: 760px) {
        .nav-item {
          width: 100%;
        }
      }

      .nav-item:hover {
        color: var(--ink);
      }

      /* The current section is a fill, not a line. */
      .nav-item[aria-current="page"] {
        background: var(--panel);
        color: var(--ink);
      }

      .well {
        flex: 1;
        min-width: 0;
        padding: 16px 12px 24px;
      }

      @media (min-width: 760px) {
        .well {
          padding: 24px 20px 32px;
        }
      }

      /* ---- Shared pieces ------------------------------------------------ */

      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px 24px;
      }

      .section {
        margin-top: 32px;
      }

      .section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 4px 16px;
        margin-bottom: 12px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 24px 0 0;
      }

      @media (min-width: 900px) {
        .stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      .stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        background: var(--panel);
      }

      .stat .value {
        margin: 0;
        font-size: 28px;
        font-weight: 200;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .stat .under {
        margin: 0;
        font-size: 11px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      /* The one place a hairline earns its keep: separating the facts row from
         the numbers above it. */
      .facts {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--rule);
      }

      @media (min-width: 640px) {
        .facts {
          flex-direction: row;
          gap: 32px;
        }
      }

      .facts dd {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      @media (min-width: 620px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1000px) {
        .grid.wide {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .card {
        display: flex;
        flex-direction: column;
        padding: 0;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--panel);
        color: inherit;
        font: inherit;
        text-align: left;
        overflow: hidden;
      }

      button.card {
        cursor: pointer;
      }

      button.card:hover {
        background: var(--recess);
      }

      /* One well, one inset, one frame. A thumbnail and its absence are drawn
         to the same geometry, so the empty card is the same card. */
      .thumb {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 3 / 2;
        margin: 4px;
        padding: 14px;
        border-radius: 7px;
        background: var(--recess);
        overflow: hidden;
      }

      .thumb img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 5px;
      }

      .card-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 8px;
        min-height: 44px;
        padding: 14px 16px 16px;
      }

      .card-title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 4px 12px;
      }

      .card-title {
        font-size: 16px;
        font-weight: 500;
        color: var(--ink);
      }

      .card-source {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink-soft);
        overflow-wrap: anywhere;
      }

      .card-foot {
        margin-top: auto;
        padding-top: 4px;
        font-size: 11px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      /* Staleness is a value shift, never a colour. Active sits on the panel,
         quiet darkens the text, stale inverts to solid ink. */
      .state {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        background: var(--recess);
        color: var(--ink-soft);
      }

      .state[data-state="quiet"] {
        color: var(--ink);
      }

      .state[data-state="stale"] {
        background: var(--ink);
        color: var(--ground);
      }

      .chip {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
      }

      .empty {
        margin: 0;
        padding: 20px 16px;
        border-radius: var(--radius-md);
        background: var(--panel);
        font-size: 13px;
        color: var(--ink-soft);
      }

      /* Wide content scrolls inside its own box so the page never does. */
      .scroller {
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .node-name {
        font-family: var(--mono);
        font-size: 12px;
      }

      .node-sub {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      /* ---- Lists -------------------------------------------------------- */

      .rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        background: var(--panel);
      }

      .row .grow {
        flex: 1;
        min-width: 0;
      }

      .row .name {
        font-size: 15px;
        font-weight: 500;
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      .row .meta {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      .entry blockquote {
        margin: 8px 0 0;
        padding-left: 12px;
        border-left: 1px solid var(--rule);
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
      }

      .topics {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }

      .open-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .open-item {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 4px 12px;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        background: var(--panel);
      }

      /* ---- The overflow menu -------------------------------------------- */

      .menu-wrap {
        position: relative;
      }

      .menu-button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: var(--radius-sm);
        background: var(--recess);
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }

      .menu {
        position: absolute;
        right: 0;
        top: 100%;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 280px;
        max-width: calc(100vw - 24px);
        margin-top: 4px;
        padding: 4px;
        border-radius: var(--radius-md);
        background: var(--recess);
      }

      .menu[hidden] {
        display: none;
      }

      .menu-item {
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 0 12px;
        border: 0;
        border-radius: var(--radius-sm);
        background: var(--panel);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .menu-note {
        margin: 0;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--panel);
        font-size: 11px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .menu-note code {
        font-family: var(--mono);
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      .back {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 4px;
        margin-left: -4px;
        border: 0;
        background: none;
        font: inherit;
        font-size: 13px;
        color: var(--ink-soft);
        cursor: pointer;
      }

      .back:hover {
        color: var(--ink);
      }

      /* ---- Footer ------------------------------------------------------- */

      .page-footer {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 12px 0;
        font-size: 11px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      @media (min-width: 720px) {
        .page-footer {
          padding: 20px 20px 0;
        }
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* One ring, everywhere, and never a border that thickens. */
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .nav-item:focus-visible,
      .card:focus-visible,
      .menu-item:focus-visible {
        outline-offset: -2px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0s !important;
          animation-duration: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="shell" data-app-shell>
        <header class="topbar">
          <button type="button" class="wordmark" id="wordmark">Canon</button>
          <span aria-hidden="true" class="sep">|</span>
          <p class="crumb" id="crumb"></p>

          <div class="account" id="account">
            <button
              type="button"
              class="account-button"
              id="account-button"
              aria-expanded="false"
              aria-haspopup="menu"
              aria-controls="account-menu"
            >
              <span class="visually-hidden">Account</span>
              <span class="avatar" id="avatar" aria-hidden="true"></span>
            </button>

            <div class="account-menu" id="account-menu" hidden>
              <div class="block">
                <p class="label">Signed in as</p>
                <p class="who" id="account-name"></p>
              </div>
              <div class="block">
                <p class="label" id="theme-label">Theme</p>
                <div class="theme-row" role="group" aria-labelledby="theme-label" id="theme-row"></div>
                <p class="note" style="font-size: 11px">
                  Dark is for the app. It is remembered on this machine only.
                </p>
              </div>
            </div>
          </div>
        </header>

        <div class="frame">
          <nav class="sidebar" aria-label="Project sections">
            <ul id="nav"></ul>
          </nav>
          <main class="well" id="well" tabindex="-1"></main>
        </div>
      </div>

      <footer class="page-footer" id="footer"></footer>
    </div>

    <script id="canon-data" type="application/json">
      __CANON_DATA__
    </script>
    <script>
      (function () {
        var data = JSON.parse(document.getElementById('canon-data').textContent);

        /* ---- Small helpers --------------------------------------------- */

        /* Every user facing string goes in as text, never as markup. The only
           innerHTML in this file is the SVG the tree draws, and everything
           that reaches it is escaped first. */
        function el(name, attrs, children) {
          var node = document.createElement(name);
          Object.keys(attrs || {}).forEach(function (key) {
            if (key === 'text') node.textContent = attrs[key];
            else if (attrs[key] !== null && attrs[key] !== undefined) {
              node.setAttribute(key, attrs[key]);
            }
          });
          (children || []).forEach(function (child) {
            if (child) node.appendChild(child);
          });
          return node;
        }

        function esc(value) {
          return String(value === null || value === undefined ? '' : value).replace(
            /[&<>"']/g,
            function (ch) {
              return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
              }[ch];
            }
          );
        }

        function plural(count, one, many) {
          return count === 1 ? one : many;
        }

        function clear(node) {
          while (node.firstChild) node.removeChild(node.firstChild);
        }

        function stateChip(staleness) {
          return el('span', {
            class: 'state',
            'data-state': staleness.state,
            text: staleness.label
          });
        }

        /* The drawn mark a family falls back to when nobody has set a
           thumbnail. A lined circle, ink only, always drawn rather than
           fetched, so it can never break. */
        function placeholderMark() {
          var lines = '';
          for (var i = 0; i < 9; i += 1) {
            var y = 18 + i * 8;
            var half = Math.sqrt(Math.max(0, 36 * 36 - (y - 54) * (y - 54)));
            lines +=
              '<line x1="' + (54 - half) + '" y1="' + y +
              '" x2="' + (54 + half) + '" y2="' + y +
              '" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />';
          }
          var wrap = el('div', { style: 'color: var(--ink-soft); opacity: 0.45; line-height: 0' });
          wrap.innerHTML =
            '<svg viewBox="0 0 108 108" width="74" height="74" role="img" aria-label="No thumbnail set">' +
            '<circle cx="54" cy="54" r="42" fill="none" stroke="currentColor" stroke-width="2.5" />' +
            lines +
            '</svg>';
          return wrap;
        }

        function thumbnail(family) {
          var slot = el('div', { class: 'thumb' });
          if (family.thumbnail) {
            slot.appendChild(

        /* ---- The node canvas --------------------------------------------- */

        function treeSvg(family) {
          var COL = 168;
          var ROW = 58;
          var W = 152;
          var H = 42;
          var order = [];

          /* Children by parent, built once. Filtering the whole node list at
             every step walked the family once per node, which is quadratic on
             a family big enough to want a tree drawn for it. */
          var childrenOf = new Map();
          family.nodes.forEach(function (node) {
            var key = node.parent === null || node.parent === undefined ? '' : node.parent;
            if (!childrenOf.has(key)) childrenOf.set(key, []);
            childrenOf.get(key).push(node);
          });

          function walk(parent, depth) {
            (childrenOf.get(parent === null ? '' : parent) || []).forEach(function (node) {
              order.push({ node: node, depth: depth });
              walk(node.name, depth + 1);
            });
          }
          walk(null, 0);

          /* An orphan's stub edge reaches to the left of its card, so the tree
             is padded to keep it inside the drawing. */
          var hasOrphan = order.some(function (item) {
            return item.node.orphaned;
          });
          var PAD = hasOrphan ? 22 : 0;

          var index = {};
          order.forEach(function (item, i) {
            index[item.node.name] = { x: PAD + item.depth * COL, y: i * ROW, depth: item.depth };
          });

          var maxDepth = order.reduce(function (max, item) {
            return Math.max(max, item.depth);
          }, 0);
          var width = PAD + maxDepth * COL + W + 4;
          var height = order.length * ROW;

          var edges = '';
          order.forEach(function (item) {
            var child = index[item.node.name];
            var parent = item.node.parent ? index[item.node.parent] : null;
            /* An orphan draws a short dashed stub going nowhere, which is the
               honest picture: the edge exists in the branch name, and the node
               it would reach was not selected. */
            if (!parent && item.node.orphaned) {
              edges +=
                '<path class="orphan-stub" d="M ' + (child.x - 18) + ' ' + (child.y + H / 2) +
                ' H ' + child.x +
                '" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3" />';
              return;
            }
            if (!parent) return;
            edges +=
              '<path d="M ' + (parent.x + 20) + ' ' + (parent.y + H) +
              ' V ' + (child.y + H / 2) +
              ' H ' + child.x +
              '" fill="none" stroke="var(--rule)" stroke-width="1.5" />';
          });

          var cards = '';
          order.forEach(function (item) {
            var pos = index[item.node.name];
            cards +=
              '<g>' +
              '<rect x="' + pos.x + '" y="' + pos.y + '" width="' + W + '" height="' + H +
              '" rx="9" fill="var(--recess)" />' +
              '<text class="node-name" x="' + (pos.x + 12) + '" y="' + (pos.y + 18) +
              '" fill="var(--ink)">' + esc(item.node.label) + '</text>' +
              '<text class="node-sub" x="' + (pos.x + 12) + '" y="' + (pos.y + 32) +
              '" fill="var(--ink-soft)">' + esc(item.node.staleness.label) + '</text>' +
              (item.node.orphaned
                ? '<text class="node-sub" x="' + (pos.x + 12) + '" y="' + (pos.y + H + 12) +
                  '" fill="var(--ink-soft)">parent not selected</text>'
                : '') +
              '</g>';
          });

          var scroller = el('div', { class: 'scroller' });
          scroller.innerHTML =
            '<svg width="' + width + '" height="' + height +
            '" viewBox="0 0 ' + width + ' ' + height +
            '" role="img" aria-label="Branch family tree for ' + esc(family.name) + '">' +
            edges + cards + '</svg>';
          return scroller;
        }

        /* ---- Views -------------------------------------------------------- */

        /* What to call this repository.
           The remote's name where there is one, because that is the name the
           work is known by. The folder name otherwise. Checked out as a
           worktree the folder is a generated hash, which is true and tells a
           reader nothing, so the remote wins wherever it exists. */
        function repoName() {
          return data.remote ? data.remote.repo : data.repo;
        }

        function statBlock(label, value, under) {
          return el('div', { class: 'stat' }, [
            el('p', { class: 'label', text: label }),
            el('p', { class: 'value', text: value }),
            el('p', { class: 'under', text: under })
          ]);
        }

        function fact(term, value) {
          return el('div', {}, [
            el('dt', { class: 'label', text: term }),
            el('dd', { class: 'mono', text: value })
          ]);
        }

        function prototypeCard(family) {
          var card = el('button', { type: 'button', class: 'card' });
          card.appendChild(thumbnail(family));

          var body = el('div', { class: 'card-body' });
          body.appendChild(
            el('div', { class: 'card-title-row' }, [
              el('span', { class: 'card-title', text: family.name }),
              stateChip(family.staleness)
            ])
          );
          /* A family whose root is a shared prefix says PREFIX rather than
             BRANCH, because calling it a branch would name something you
             could not check out. */
          body.appendChild(
            el('p', { class: 'label', text: family.virtualRoot ? 'Prefix' : 'Branch' })
          );
          body.appendChild(el('span', { class: 'card-source', text: family.root }));

          var variants = family.size - (family.virtualRoot ? 0 : 1);
          body.appendChild(
            el('p', {
              class: 'card-foot',
              text:
                (family.lastCommit || 'no commit date') +
                ' · ' +
                (variants > 0
                  ? variants + ' ' + plural(variants, 'variant', 'variants')
                  : 'no variants')
            })
          );

          card.appendChild(body);
          card.addEventListener('click', function () {
            go('prototypes/' + encodeURIComponent(family.root));
          });
          return card;
        }

        function prototypeGrid(wide) {

          data.families.forEach(function (family) {
            grid.appendChild(prototypeCard(family));

        /* The overflow menu on a family page. Neither item touches git and
           neither writes to disk: the page is a file, so setting a thumbnail
           is a config key it can name but not change. */
        function familyMenu(family) {
          var wrap = el('div', { class: 'menu-wrap' });
          var button = el('button', {
            type: 'button',
            class: 'menu-button',
            'aria-expanded': 'false',
            'aria-haspopup': 'menu'
          });
          button.appendChild(el('span', { 'aria-hidden': 'true', text: '···' }));
          button.appendChild(el('span', { class: 'visually-hidden', text: 'More about this family' }));

          var menu = el('div', { class: 'menu', role: 'menu', hidden: 'hidden' });
          var status = el('p', { class: 'menu-note', role: 'status' });

          var copy = el('button', {
            type: 'button',
            class: 'menu-item',
            role: 'menuitem',
            text: 'Copy branch name'
          });
          copy.addEventListener('click', function () {
            function said(message) {
              status.textContent = message;
            }
            try {
              navigator.clipboard.writeText(family.root).then(
                function () {
                  said('Copied ' + family.root);
                },
                function () {
                  said('Could not reach the clipboard. The name is ' + family.root);
                }
              );
            } catch (err) {
              said('Could not reach the clipboard. The name is ' + family.root);
            }
          });

          var thumb = el('button', {
            type: 'button',
            class: 'menu-item',
            role: 'menuitem',
            text: 'Set thumbnail path'
          });
          thumb.addEventListener('click', function () {
            clear(status);
            status.appendChild(document.createTextNode('This page cannot write to disk. Set '));
            status.appendChild(
              el('code', { text: 'thumbnails["' + family.root + '"]' })
            );
            status.appendChild(
              document.createTextNode(' in .canon/config.json and run canon open again.')
            );
          });

          menu.appendChild(copy);
          menu.appendChild(thumb);
          menu.appendChild(status);

          button.addEventListener('click', function () {
            var open = menu.hidden;
            menu.hidden = !open;
            button.setAttribute('aria-expanded', String(open));
          });
          document.addEventListener('click', function (event) {
            if (!wrap.contains(event.target)) {
              menu.hidden = true;
              button.setAttribute('aria-expanded', 'false');
            }
          });

          wrap.appendChild(button);
          wrap.appendChild(menu);
          return wrap;
        }

        function familyView(root) {

          frag.appendChild(

          return frag;

                  ' ' +
                  plural(data.counts.people, 'person', 'people')
              })
            ])
          );

          if (!data.people.length) {
            section.appendChild(
              el('p', { class: 'empty', text: 'No commits have been made in this repository yet.' })
            );
          } else {
            var rows = el('ul', { class: 'rows' });
            data.people.forEach(function (person) {
              rows.appendChild(
                el('li', { class: 'row' }, [
                  el('span', {
                    class: 'avatar',
                    'aria-hidden': 'true',
                    text: initials(person.name)
                  }),
                  el('div', { class: 'grow' }, [
                    el('span', { class: 'name', text: person.name }),
                    el('p', {
                      class: 'meta',
                      /* The space lives inside the literal on purpose. The
                         git guard fails on a bare quoted subcommand anywhere
                         in the shipped files, and it should stay that blunt,
                         so the English noun is never spelled as one. */
                      text:
                        person.commits +
                        plural(person.commits, ' commit', ' commits') +
                        ', last on ' +
                        person.lastCommit
                    })
                  ])
                ])
              );
            });
            section.appendChild(rows);
          }
          frag.appendChild(section);
          return frag;
        }

        function initials(name) {
          var words = String(name || '').trim().split(/\s+/).filter(Boolean);
          if (!words.length) return '?';
          var last = words.length > 1 ? words[words.length - 1][0] : '';
          return (words[0][0] + last).toUpperCase();
        }

        /* ---- The footer ---------------------------------------------------- */

        function buildFooter() {
          var footer = document.getElementById('footer');
          footer.appendChild(
            el('p', {
              style: 'margin: 0',
              text:
                'Generated by canon open on ' +
                data.generatedAt +
                '. It reads this repository and never writes to it.'
            })
          );
          footer.appendChild(
            el('p', {
              style: 'margin: 4px 0 0',
              text:
                'Everything here is local to this machine, and the page makes no request of any kind. It is safe to delete: canon open writes it again.'
            })
          );
        }

        /* ---- Render -------------------------------------------------------- */

        function render() {
          var route = currentRoute();
          var well = document.getElementById('well');
          clear(well);

          var view = route.view;
          if (view === 'prototypes' && route.param) {
            well.appendChild(familyView(route.param));
            markNav('prototypes');
          } else if (view === 'prototypes') {
            well.appendChild(prototypesView());
            markNav('prototypes');
          } else if (view === 'research') {
            well.appendChild(researchView());
            markNav('research');
          } else if (view === 'members') {
            well.appendChild(membersView());
            markNav('members');
          } else {
            well.appendChild(overviewView());
            markNav('overview');
          }
        }

        buildThemeRow();
        buildTopBar();
        buildNav();
        buildFooter();
        render();

        window.addEventListener('hashchange', function () {
          render();
          /* The view changed without a page load, so focus is moved to the
             new content rather than left where the old view was. */
          document.getElementById('well').focus();
        });
      })();
    </script>
  </body>
</html>
